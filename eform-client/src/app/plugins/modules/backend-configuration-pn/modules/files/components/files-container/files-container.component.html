<mat-card class="eform-sub-header d-flex flex-column gap-12 mb-3 p-3" style="align-items: stretch;">
  <app-archive-section-nav></app-archive-section-nav>
  <h2 style="margin: 0">{{ pageTitle | translate }}</h2>
  <div class="d-flex flex-row flex-wrap align-items-end justify-content-end gap-12">
    <app-files-filters [availableTags]="availableTags" (updateTable)="refresh()"></app-files-filters>
    <button
      type="button"
      id="archiveDateCheckChip"
      class="chip"
      [class.chip-selected]="filters?.needsDateCheck"
      [attr.aria-pressed]="!!filters?.needsDateCheck"
      (click)="toggleDateCheck()"
    >
      <mat-icon>event_busy</mat-icon>
      <span>{{ 'Date needs checking' | translate }}</span>
      <span class="archive-chip-count" id="archiveDateCheckCount">{{ dateCheckCount }}</span>
    </button>
    <button
      class="btn-secondary btn-secondary--icon-left"
      id="manageTagsBtn"
      matTooltip="{{ 'Manage tags' | translate }}"
      (click)="openTagsModal()"
    >
      <mat-icon>label</mat-icon>
      <span>{{ 'Tags' | translate }}</span>
    </button>
    <button
      class="btn-primary btn-primary--icon-left"
      id="addNewFileBtn"
      matTooltip="{{ 'Upload document' | translate }}"
      routerLink="./create"
      [queryParams]="{folderId: selectedFolderId}"
    >
      <mat-icon>file_upload</mat-icon>
      <span>{{ 'Upload document' | translate }}</span>
    </button>
  </div>
</mat-card>

<!-- An opened document covers the archive area: --viewing hides the tree and the centre column (display:none, so the
     table keeps its DOM, scroll and selection) and the view takes their place. Hosts are display:contents, so the
     tree's nav.archive-rail, section.archive-center and the view's aside.archive-view are the grid items. -->
<div class="archive-workspace" [class.archive-workspace--viewing]="currentFileId !== null">
  <app-archive-folder-tree
    [folders]="folders"
    [selectedFolderId]="listMode === 'folder' ? selectedFolderId : null"
    [canManage]="canManage"
    [dragActive]="dragActive"
    (folderSelected)="selectFolder($event)"
    (createTop)="createTopFolder()"
    (createSubfolder)="createSubfolder($event)"
    (renameFolder)="renameFolder($event)"
    (moveFolder)="moveFolder($event)"
    (editAccess)="editFolderAccess($event)"
    (deleteFolder)="deleteFolder($event)"
    (filesDropped)="onFolderDrop($event)"
  ></app-archive-folder-tree>

  <section class="archive-center">
    <div class="archive-crumb" id="archiveCrumb" [ngSwitch]="listMode">
      <span *ngSwitchCase="'search'">{{ 'Search results in all folders' | translate }}</span>
      <span *ngSwitchCase="'date'">{{ 'Date needs checking' | translate }} · {{ 'all folders' | translate }}</span>
      <ng-container *ngSwitchDefault>
        <ng-container *ngFor="let part of selectedPath; let last = last">
          <span [class.archive-crumb__parent]="!last">{{ part }}</span>
          <mat-icon *ngIf="!last">chevron_right</mat-icon>
        </ng-container>
        <span class="archive-crumb__access" id="archiveCrumbAccess"><mat-icon>group</mat-icon>{{ crumbAccessLabel }}</span>
      </ng-container>
    </div>

    <div class="archive-subfolders" id="archiveSubfolders" *ngIf="listMode === 'folder' && subfolders.length">
      <button type="button" class="chip" *ngFor="let sub of subfolders" [attr.data-folder-id]="sub.id" (click)="selectFolder(sub.id)">
        <mat-icon>folder</mat-icon><span>{{ sub.name }}</span><span class="archive-chip-count">{{ sub.count }}</span>
      </button>
    </div>

    <div class="archive-selbar" id="archiveSelectionBar" *ngIf="selectedFileIds.length">
      <strong>{{ selectedKey | translate: {count: selectedFileIds.length} }}</strong>
      <button type="button" class="btn-secondary btn-secondary--icon-left" id="archiveMoveSelectedBtn" (click)="moveSelected()">
        <mat-icon>drive_file_move</mat-icon><span>{{ 'Move to folder' | translate }}</span>
      </button>
      <button type="button" class="btn-secondary btn-secondary--icon-left" id="archivePropertiesSelectedBtn" (click)="setSelectedProperties()">
        <mat-icon>home_work</mat-icon><span>{{ 'Properties' | translate }}</span>
      </button>
      <button *ngIf="canManage" type="button" class="btn-secondary btn-secondary--icon-left" id="archiveAccessSelectedBtn" (click)="setSelectedAccess()">
        <mat-icon>group</mat-icon><span>{{ 'Read access' | translate }}</span>
      </button>
      <button type="button" class="btn-secondary btn-secondary--icon-left" id="archiveDownloadSelectedBtn" (click)="downloadSelectedFiles()">
        <mat-icon>download</mat-icon><span>{{ 'Download selected' | translate }}</span>
      </button>
      <button mat-icon-button type="button" id="archiveClearSelectionBtn" [attr.aria-label]="'Clear selection' | translate" (click)="selectedFileIds = []">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <app-files-table
      [files]="files"
      [canManage]="canManage"
      [canDelete]="canDelete"
      [loaded]="filesLoaded"
      [selectedIds]="selectedFileIds"
      [currentFileId]="currentFileId"
      [highlightedFileId]="highlightedFileId"
      [sortField]="sortField"
      [sortDesc]="sortDesc"
      (selectedIdsChange)="selectedFileIds = $event"
      (openFile)="openFile($event)"
      (openDeleteModal)="showDeleteModal($event)"
      (rowDragStart)="onRowDragStart($event)"
      (rowDragEnd)="onRowDragEnd()"
      (sort)="onSort($event)"
    ></app-files-table>
  </section>

  <app-archive-document-panel
    *ngIf="currentFileId !== null"
    [fileId]="currentFileId"
    [folders]="folders"
    [folderOptions]="options"
    [properties]="properties"
    [availableTags]="availableTags"
    [workerTags]="workerTags"
    [canManage]="canManage"
    [positionLabel]="positionLabel"
    [hasPrevious]="hasPrevious"
    [hasNext]="hasNext"
    (saved)="onPanelSaved($event)"
    (closed)="closePanel()"
    (previousFile)="showPrevious()"
    (nextFile)="showNext()"
  ></app-archive-document-panel>
</div>

<app-file-tags
  #tagsModal
  [availableTags]="availableTags"
  [canManage]="canManage"
  (tagsChanged)="getTags()"
>
</app-file-tags>
