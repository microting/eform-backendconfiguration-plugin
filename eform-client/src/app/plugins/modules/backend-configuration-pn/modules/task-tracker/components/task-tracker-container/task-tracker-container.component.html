<mat-card class="eform-sub-header d-flex flex-column gap-12 mb-3 p-3" style="align-items: stretch;">
  <h2 style="margin: 0">{{ pageTitle | translate }}</h2>
  <div class="d-flex flex-row flex-wrap align-items-end justify-content-end gap-12">
    <app-task-tracker-filters
      (updateTable)="updateTable()"
      [properties]="properties"
      [tags]="tags"
    />
    <button
      class="btn-secondary btn-secondary--icon-rounded-border"
      id="excelReportBtn"
      (click)="onDownloadExcelReport()"
      matTooltip="{{ 'Excel report' | translate }}"
    >
      <mat-icon svgIcon="file-excel"></mat-icon>
    </button>
    <button
      class="btn-primary btn-primary--icon-left"
      id="createNewTaskBtn"
      matTooltip="{{ 'Create new task' | translate }}"
      (click)="openCreateTaskModal()"
    >
      <mat-icon>add</mat-icon>
      <span>{{ 'Create new task' | translate }}</span>
    </button>
  </div>
</mat-card>

<div class="d-flex flex-column">
  <div class="px-3 mb-4">
    <app-planned-task-days
      *ngIf="showDiagram"
      [plannedTaskDaysModel]="plannedTaskDays"
      [selectedPropertyName]="propertyName"
      [view]="view"
      class="mb-2 w-100"
    />
  </div>

  <!--  <div class="d-flex flex-row justify-content-start mb-4 px-3">-->
  <!--    <button-->
  <!--      mat-raised-button-->
  <!--      id="changeColumnsBtn"-->
  <!--      (click)="openColumnsModal()"-->
  <!--      color="primary">-->
  <!--      {{'Show/hide columns' | translate}}-->
  <!--    </button>-->
  <!--  </div>-->
  <app-task-tracker-table
    [columnsFromDb]="columns"
    [tasks]="tasks"
    (updateTable)="updateTable()"
    (openAreaRulePlanningModal)="openEditTaskModal($event)"
    (openSelectWorkerModal)="openSelectWorkerModal($event)"
    [highlightId]="highlightIdFromRoute"
  >
  </app-task-tracker-table>
</div>

<app-planning-tags
  #planningTagsModal
  [availableTags]="tags"
></app-planning-tags>
