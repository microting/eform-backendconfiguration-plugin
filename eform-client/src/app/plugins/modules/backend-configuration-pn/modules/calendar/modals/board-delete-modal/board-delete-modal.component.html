<h3 mat-dialog-title>{{ 'Delete calendar' | translate }}</h3>

<div mat-dialog-content>
  <p>{{ 'Are you sure you want to delete the calendar' | translate }} <strong>{{ data.board.name }}</strong>?</p>
  <p>
    {{ 'This will permanently delete the calendar and its {{count}} events. This cannot be undone.' | translate:{count: eventCount} }}
  </p>
</div>

<div mat-dialog-actions class="d-flex flex-row justify-content-end">
  <button class="btn-cancel" (click)="onCancel()">{{ 'Cancel' | translate }}</button>
  <button class="btn-delete" [disabled]="!countLoaded" (click)="onConfirm()">{{ 'Delete' | translate }}</button>
</div>
