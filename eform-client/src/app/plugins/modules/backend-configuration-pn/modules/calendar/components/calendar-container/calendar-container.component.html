<div class="calendar-shell" [class.sidebar-closed]="!sidebarOpen || viewMode === 'compliance'">
  <app-calendar-sidebar
    *ngIf="viewMode !== 'compliance'"
    [properties]="properties"
    [boards]="boards"
    [teams]="teams"
    [employees]="employees"
    [tags]="tags"
    [activeBoardIds]="activeBoardIds"
    [activeSiteIds]="activeSiteIds"
    [activeTeamIds]="activeTeamIds"
    [activeTagNames]="activeTagNames"
    [selectedPropertyId]="currentPropertyId"
    (propertySelected)="onPropertySelected($event)"
    (boardToggled)="onBoardToggled($event)"
    (teamToggled)="onTeamToggled($event)"
    (employeeToggled)="onEmployeeToggled($event)"
    (tagToggled)="onTagToggled($event)"
    (createTag)="onCreateTag($event)"
    (updateTag)="onUpdateTag($event)"
    (deleteTag)="onDeleteTag($event)"
    (createBoard)="onCreateBoard()"
    (updateBoard)="onUpdateBoard($event)"
    (deleteBoard)="onDeleteBoard($event)"
    (createTeam)="onCreateTeam($event)"
    (updateTeam)="onUpdateTeam($event)"
    (deleteTeam)="onDeleteTeam($event)"
  ></app-calendar-sidebar>

  <div class="calendar-main">
    <app-calendar-header
      [currentDate]="currentDate"
      [viewMode]="viewMode"
      [sidebarOpen]="sidebarOpen"
      [propertyName]="selectedPropertyName"
      [isAdmin]="isAdmin"
      [scheduleScope]="scheduleScope"
      (navigate)="onNavigate($event)"
      (goToToday)="onGoToToday()"
      (viewModeChange)="onViewModeChange($event)"
      (toggleSidebar)="onToggleSidebar()"
      (propertyPillClicked)="onPropertyPillClicked()"
    ></app-calendar-header>

    <ng-container [ngSwitch]="viewMode">
      <app-calendar-week-grid
        *ngSwitchCase="'week'"
        [tasksByDay]="tasksByDay"
        [allDayTasksByDay]="allDayTasksByDay"
        [isAdmin]="isAdmin"
        [currentDate]="currentDate"
        [boards]="boards"
        [employees]="employees"
        [tags]="tagNames"
        [properties]="properties"
        (slotClicked)="openCreateModal($event)"
        (taskClicked)="onTaskClickedFromGrid($event)"
        (taskMoved)="onTaskMoved($event)"
        (taskResized)="onTaskResized($event)"
        (tasksReload)="loadTasks()"
        (toggleCompleteRequested)="onToggleCompleteRequested($event)"
      ></app-calendar-week-grid>

      <app-calendar-week-grid
        *ngSwitchCase="'day'"
        [tasksByDay]="tasksByDay"
        [allDayTasksByDay]="allDayTasksByDay"
        [isAdmin]="isAdmin"
        [currentDate]="currentDate"
        [boards]="boards"
        [dayViewMode]="true"
        (slotClicked)="openCreateModal($event)"
        (taskClicked)="onTaskClickedFromGrid($event)"
        (taskMoved)="onTaskMoved($event)"
        (taskResized)="onTaskResized($event)"
        (tasksReload)="loadTasks()"
        (toggleCompleteRequested)="onToggleCompleteRequested($event)"
      ></app-calendar-week-grid>

      <app-calendar-schedule-view
        *ngSwitchCase="'schedule'"
        [tasksByDay]="scheduleScope === 'month' ? monthScheduleTasksByDay : tasksByDay"
        [currentDate]="currentDate"
        [boards]="boards"
        [rangeStart]="scheduleRangeStart"
        [emptyTextKey]="scheduleScope === 'month' ? 'No tasks this month' : 'No tasks this week'"
        (taskClicked)="onTaskClickedFromGrid($event)"
        (tasksReload)="loadTasks()"
        (toggleCompleteRequested)="onToggleCompleteRequested($event)"
      ></app-calendar-schedule-view>

      <ng-container *ngSwitchCase="'month'">
        <app-calendar-month-view
          *ngIf="isAdmin"
          [monthDate]="currentDate"
          [tasksByDate]="monthTasksByDate"
          (weekClicked)="onMonthWeekClicked($event)"
          (dayClicked)="onMonthDayClicked($event)"
          (scheduleClicked)="onMonthScheduleClicked()"
        ></app-calendar-month-view>
      </ng-container>

      <ng-container *ngSwitchCase="'compliance'">
        <app-calendar-compliance-view
          *ngIf="isAdmin"
          #complianceView
          [properties]="properties"
          [boards]="boards"
          [tags]="tags"
          [employees]="employees"
          [currentPropertyId]="currentPropertyId"
          (completeRequested)="onComplianceRowCompleteRequested($event)"
        ></app-calendar-compliance-view>
      </ng-container>
    </ng-container>
  </div>
</div>
