<div class="calendar-shell">
  <div class="calendar-main">
    <app-calendar-header
      [currentDate]="currentDate"
      [viewMode]="viewMode"
      [propertyName]="selectedPropertyName"
      [properties]="properties"
      [selectedPropertyId]="currentPropertyId"
      [boards]="boards"
      [activeBoardIds]="activeBoardIds"
      [scheduleScope]="scheduleScope"
      (navigate)="onNavigate($event)"
      (goToToday)="onGoToToday()"
      (viewModeChange)="onViewModeChange($event)"
      (propertySelected)="onPropertySelected($event)"
      (boardToggled)="onBoardToggled($event)"
      (selectAllBoards)="onSelectAllBoards()"
      (clearBoards)="onClearBoards()"
      (createBoard)="onCreateBoard()"
      (updateBoard)="onUpdateBoard($event)"
      (deleteBoard)="onDeleteBoard($event)"
    ></app-calendar-header>

    <ng-container [ngSwitch]="viewMode">
      <app-calendar-week-grid
        *ngSwitchCase="'week'"
        [tasksByDay]="tasksByDay"
        [allDayTasksByDay]="allDayTasksByDay"
        [isAdmin]="isAdmin"
        [currentDate]="currentDate"
        [boards]="boards"
        [employees]="employees"
        [tags]="tagNames"
        [properties]="properties"
        (slotClicked)="openCreateModal($event)"
        (taskClicked)="onTaskClickedFromGrid($event)"
        (taskMoved)="onTaskMoved($event)"
        (taskResized)="onTaskResized($event)"
        (tasksReload)="loadTasks()"
        (toggleCompleteRequested)="onToggleCompleteRequested($event)"
      ></app-calendar-week-grid>

      <app-calendar-week-grid
        *ngSwitchCase="'day'"
        [tasksByDay]="tasksByDay"
        [allDayTasksByDay]="allDayTasksByDay"
        [isAdmin]="isAdmin"
        [currentDate]="currentDate"
        [boards]="boards"
        [dayViewMode]="true"
        (slotClicked)="openCreateModal($event)"
        (taskClicked)="onTaskClickedFromGrid($event)"
        (taskMoved)="onTaskMoved($event)"
        (taskResized)="onTaskResized($event)"
        (tasksReload)="loadTasks()"
        (toggleCompleteRequested)="onToggleCompleteRequested($event)"
      ></app-calendar-week-grid>

      <app-calendar-schedule-view
        *ngSwitchCase="'schedule'"
        [tasksByDay]="scheduleScope === 'month' ? monthScheduleTasksByDay : tasksByDay"
        [currentDate]="currentDate"
        [boards]="boards"
        [rangeStart]="scheduleRangeStart"
        [emptyTextKey]="scheduleScope === 'month' ? 'No tasks this month' : 'No tasks this week'"
        (taskClicked)="onTaskClickedFromGrid($event)"
        (tasksReload)="loadTasks()"
        (toggleCompleteRequested)="onToggleCompleteRequested($event)"
      ></app-calendar-schedule-view>

      <ng-container *ngSwitchCase="'month'">
        <app-calendar-month-view
          [monthDate]="currentDate"
          [tasksByDate]="monthTasksByDate"
          (weekClicked)="onMonthWeekClicked($event)"
          (dayClicked)="onMonthDayClicked($event)"
          (scheduleClicked)="onMonthScheduleClicked()"
        ></app-calendar-month-view>
      </ng-container>
    </ng-container>
  </div>
</div>
