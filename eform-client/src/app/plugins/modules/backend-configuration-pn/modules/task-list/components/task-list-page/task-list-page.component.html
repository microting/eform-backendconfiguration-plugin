<mat-card>
  <mat-card-content>
    <div class="tl-header">
      <h1>{{ 'Tasks and actions' | translate }}</h1>
    </div>
    <app-task-list-filters
      [properties]="properties" [boards]="boards" [eforms]="eforms"
      [workers]="workers" [tags]="tags"
      (filtersChanged)="onFiltersChanged($event)"
      (propertyChanged)="onPropertyChanged($event)">
    </app-task-list-filters>
    <div class="task-list-toolbar">
      <mat-form-field>
        <mat-label>{{ 'Batch action' | translate }}</mat-label>
        <mtx-select id="taskListBatchAction"
                    [items]="batchActions"
                    bindValue="id" bindLabel="label"
                    groupBy="group"
                    [selectableGroup]="false"
                    [disabled]="selection.size === 0"
                    [(ngModel)]="pendingAction"
                    (change)="onBatchActionPicked($event)"
                    [placeholder]="'Select batch action' | translate">
          <!-- The mtx-select panel is body-appended (mtx appendTo defaults to
               'body'), so component-scoped SCSS can't reach it. These templates
               emit classes unique to THIS dropdown; the matching rules live in
               the shared _material-dropdown.scss (mockup typography: bold group
               headers, regular options, native-select-gray disabled options). -->
          <ng-template ng-optgroup-tmp let-item$="item$">
            <span class="tl-batch-action-group-label">{{ item$.label }}</span>
          </ng-template>
          <ng-template ng-option-tmp let-item$="item$">
            <span class="tl-batch-action-option-label">{{ item$.label }}</span>
          </ng-template>
        </mtx-select>
      </mat-form-field>
      <span id="taskListSelectionCount" *ngIf="selection.size > 0">
        {{ selection.size }} {{ 'tasks selected' | translate }}
      </span>
      <!-- #1194 — FIRST element of the right-aligned group (its SCSS carries
           the `margin-left: auto`). Re-fetches tasks + tags from the database
           keeping filters and the column sort; disabled while a tasks/index
           request is in flight so a double-click cannot issue two overlapping
           requests. Refresh CLEARS any batch selection (the batch dropdown
           returns to disabled) — every reload path does. -->
      <button mat-icon-button color="primary" id="taskListRefreshBtn"
              [matTooltip]="'Refresh table' | translate"
              [attr.aria-label]="'Refresh table' | translate"
              [disabled]="loading"
              (click)="refresh()">
        <mat-icon>refresh</mat-icon>
      </button>
      <button mat-raised-button color="accent" id="taskListManageTagsBtn" (click)="openTagsModal()">
        <mat-icon>label</mat-icon>{{ 'Manage tags' | translate }}
      </button>
      <button mat-raised-button color="accent" id="taskListCsvExportBtn" (click)="exportCsv()">
        <mat-icon>download</mat-icon>{{ 'Export CSV' | translate }}
      </button>
    </div>
    <app-task-list-table
      #taskListTable
      [tasks]="tasks" [properties]="properties" [boards]="boards"
      [eforms]="eforms" [planningTags]="tags" [loading]="loading"
      (editTask)="onEditTask($event)"
      (renameTask)="onRenameTask($event)"
      (selectionChanged)="onSelectionChanged($event)">
    </app-task-list-table>
    <!-- Renders nothing; owns the shared tag dialogs opened by #taskListManageTagsBtn. -->
    <app-task-list-tags
      #tagsModal
      [availableTags]="tags"
      (tagsChanged)="onUpdateTags()">
    </app-task-list-tags>
  </mat-card-content>
</mat-card>
