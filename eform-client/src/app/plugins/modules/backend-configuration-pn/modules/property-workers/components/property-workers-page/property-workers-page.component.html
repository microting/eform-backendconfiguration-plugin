<mat-card class="eform-sub-header d-flex flex-column gap-12 mb-3 p-3" style="align-items: stretch;" [formGroup]="filtersForm">
  <h2 style="margin: 0">{{ pageTitle | translate }}</h2>
  <div class="d-flex flex-row flex-wrap align-items-end justify-content-end gap-12">
    <div class="text-field--rounded mt-4">
      <mat-form-field>
        <mat-label>{{ 'Search' | translate }}</mat-label>
        <input
          matInput
          type="text"
          (ngModelChange)="onSearchChanged($event)"
          [ngModel]="selectPropertyWorkersNameFilters$ | async"
          [ngModelOptions]="{standalone: true}"
          id="labelInput"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    <div class="text-field--rounded mt-4">
      <mat-form-field style="flex: 0 0 25%; min-width: 150px;">
        <mat-label>{{ 'Tags' | translate }}</mat-label>
        <mtx-select
          [items]="availableTags"
          bindLabel="name"
          bindValue="id"
          [multiple]="true"
          [ngModel]="selectedTagIds"
          (ngModelChange)="onTagsChanged($event)"
          [ngModelOptions]="{standalone: true}"
          id="planningTags">
        </mtx-select>
      </mat-form-field>
    </div>
    <mat-form-field>
      <mat-label>{{ 'Location' | translate }}</mat-label>
      <mtx-select
        formControlName="propertyIds"
        multiple="true"
        clearable="true"
        [items]="availableProperties"
        [bindValue]="'id'"
        [bindLabel]="'name'"
      />
    </mat-form-field>
    <mat-slide-toggle
      formControlName="showResigned"
      color="primary"
      class="mt-2"
      id="showCalculationsAsNumberToggle"
    >
      {{ 'Show resigned' | translate }}
    </mat-slide-toggle>
    <button
      class="btn-secondary btn-secondary--icon-left"
      id="sitesManageTagsBtn"
      (click)="openEditTagsModal()"
      matTooltip="{{ 'Manage tags' | translate }}"
    >
      <mat-icon>label</mat-icon>
      <span>{{ 'Tags' | translate }}</span>
    </button>
    <button
      class="btn-primary btn-primary--icon-left"
      (click)="exportCsv()"
      matTooltip="{{ 'Export CSV' | translate }}"
    >
      <mat-icon>download</mat-icon>
      <span>{{ 'Export CSV' | translate }}</span>
    </button>
    <button
      class="btn-primary btn-primary--icon-left"
      id="newDeviceUserBtn"
      *ngIf="selectCurrentUserClaimsDeviceUsersCreate$ | async"
      matTooltip="{{ 'Create new employee' | translate }}"
      (click)="openCreateModal()"
      [matTooltipPosition]="'left'"
    >
      <mat-icon>add</mat-icon>
      <span>{{ 'Create new employee' | translate }}</span>
    </button>
  </div>
</mat-card>

<app-property-worker-table
  (updateTable)="updateTable()"
  (updateTableWithHighlight)="updateTableWithHighlight($event)"
  (highlightedRowRendered)="onHighlightedRowRendered()"
  [availableProperties]="availableProperties"
  [workersAssignments]="workersAssignments"
  [sitesDto]="sitesDto"
  [showResigned]="showResigned"
  [availableTags]="availableTags"
  [alreadyUsedEmails]="alreadyUsedEmails"
  [highlightedSiteId]="highlightedSiteId"
>
</app-property-worker-table>

<app-eforms-tags
  #modalTags
  [availableTags]="availableTags"
  (tagsChanged)="loadAllTags()"
>
</app-eforms-tags>
