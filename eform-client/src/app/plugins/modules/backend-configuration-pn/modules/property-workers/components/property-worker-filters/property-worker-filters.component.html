<div class="filters-inline" [formGroup]="filtersForm">
  <mat-form-field>
    <mat-label>{{'Location' | translate}}</mat-label>
    <mtx-select
      formControlName="propertyIds"
      multiple="true"
      clearable="true"
      [items]="properties"
      [bindValue]="'id'"
      [bindLabel]="'name'"
    />
  </mat-form-field>
  <mat-slide-toggle
    formControlName="showResigned"
    color="primary"
    class="mt-2"
    id="showCalculationsAsNumberToggle"
  >
    {{ 'Show resigned' | translate }}
  </mat-slide-toggle>
</div>
