<mat-card class="eform-sub-header d-flex flex-column gap-12 mb-3 p-3" style="align-items: stretch;">
  <h2 style="margin: 0">{{ pageTitle | translate }}</h2>
  <div class="d-flex flex-row flex-wrap align-items-center justify-content-between gap-12">
    <div class="btn-group" role="group">
      <button
        type="button"
        class="btn-secondary"
        id="backend-configuration-pn-adhoc-view-list"
        routerLink="."
        [class.active]="!isHistoryView"
      >
        {{ 'Overview' | translate }}
      </button>
      <button
        type="button"
        class="btn-secondary"
        id="backend-configuration-pn-adhoc-view-history"
        routerLink="history"
        [class.active]="isHistoryView"
      >
        {{ 'History' | translate }}
      </button>
    </div>
    <button
      class="btn-primary btn-primary--icon-left"
      id="backend-configuration-pn-adhoc-new-task"
      (click)="openCreateTask()"
    >
      <mat-icon>add</mat-icon>
      <span>{{ 'New task' | translate }}</span>
    </button>
  </div>
</mat-card>

<div *ngIf="!isHistoryView" id="main-list-view">
  <app-adhoc-filters [counts]="counts"></app-adhoc-filters>
  <app-adhoc-table
    [tasks]="tasks"
    [status]="status"
    (updateTable)="updateTable()"
    (viewTask)="onViewTask($event)"
    (editTask)="onEditTask($event)"
    (copyTask)="onCopyTask($event)"
    (deleteTask)="onDeleteTask($event)"
    (completeTask)="onCompleteTask($event)"
  ></app-adhoc-table>
  <eform-pagination
    [pagination]="pagination"
    (paginationChanged)="onPaginationChanged($event)"
  ></eform-pagination>
</div>

<router-outlet></router-outlet>
