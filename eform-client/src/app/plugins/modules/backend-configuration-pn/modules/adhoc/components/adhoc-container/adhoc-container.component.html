<mat-card class="eform-sub-header d-flex flex-column gap-12 mb-3 p-3" style="align-items: stretch;">
  <h2 style="margin: 0">{{ pageTitle | translate }}</h2>
  <!--
    Filters render inline in this sub-header row via the plugin's
    `.filters-inline` display:contents convention (see
    task-management-container / documents-container). `.ml-auto` pushes the
    "Ny opgave" button to the row's right edge.
  -->
  <div class="d-flex flex-row flex-wrap align-items-end gap-12">
    <!--
      Overblik/Historik (#1331). The checked toggle is derived from the route
      (`viewMode`), so browser back/forward moves it too; `(change)` navigates,
      which also covers the group's keyboard selection (arrows/Enter/Space do
      not fire a DOM click, so a routerLink on the toggle would miss them).
    -->
    <mat-button-toggle-group
      class="adhoc-view-toggle"
      [value]="viewMode"
      [attr.aria-label]="'View mode' | translate"
      (change)="onViewModeChange($event.value)"
    >
      <mat-button-toggle id="backend-configuration-pn-adhoc-view-list" value="list">
        {{ 'Overview' | translate }}
      </mat-button-toggle>
      <mat-button-toggle id="backend-configuration-pn-adhoc-view-history" value="history">
        {{ 'History' | translate }}
      </mat-button-toggle>
    </mat-button-toggle-group>
    <app-adhoc-filters *ngIf="!isHistoryView" [counts]="counts"></app-adhoc-filters>
    <button
      class="btn-primary btn-primary--icon-left ml-auto"
      id="backend-configuration-pn-adhoc-new-task"
      (click)="openCreateTask()"
    >
      <mat-icon>add</mat-icon>
      <span>{{ 'New task' | translate }}</span>
    </button>
  </div>
</mat-card>

<div *ngIf="!isHistoryView" id="main-list-view">
  <app-adhoc-table
    [tasks]="tasks"
    [status]="status"
    (updateTable)="updateTable()"
    (viewTask)="onViewTask($event)"
    (editTask)="onEditTask($event)"
    (copyTask)="onCopyTask($event)"
    (deleteTask)="onDeleteTask($event)"
    (completeTask)="onCompleteTask($event)"
  ></app-adhoc-table>
  <eform-pagination
    [pagination]="pagination"
    (paginationChanged)="onPaginationChanged($event)"
  ></eform-pagination>
</div>

<router-outlet></router-outlet>
