syntax = "proto3";

package microting.settings.v1;

service Settings {
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (RegisterPushTokenResponse);
  rpc SetUserPrefs(SetUserPrefsRequest) returns (SetUserPrefsResponse);
  rpc ReportInstall(ReportInstallRequest) returns (ReportInstallResponse);
}

message RegisterPushTokenRequest {
  string fcm_token = 1;
  string platform = 2;          // "android" | "ios"
  string app_id = 3;            // "eform" | "adhoc" - which app minted the token
  string installation_id = 4;   // stable per-install UUID; identity of the row
}
message RegisterPushTokenResponse {}

message SetUserPrefsRequest {
  string language = 1;          // BCP-47 (e.g. "da", "en")
  bool biometric_enabled = 2;
  bool push_enabled = 3;
}
message SetUserPrefsResponse {}

// Sent on every app start-up and login, whether or not push permission is
// granted, so the backend knows which version of which app a worker runs.
message ReportInstallRequest {
  string app_id = 1;              // "eform" | "adhoc" | "chemistry" | "halebid"
  string installation_id = 2;     // the same per-install UUID RegisterPushToken sends
  string platform = 3;            // "android" | "ios"
  string app_version = 4;         // e.g. "4.1.23" (VERSION in version/version.properties)
  string app_build = 5;           // build number, e.g. "40123"
  string device_model = 6;
  string device_manufacturer = 7;
  string os_version = 8;
}
message ReportInstallResponse {}
