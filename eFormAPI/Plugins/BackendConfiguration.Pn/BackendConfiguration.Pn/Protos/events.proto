syntax = "proto3";

// English wire contract per
// docs/superpowers/specs/2026-05-25-lift-danish-carve-outs-design.md.
// All previously-Danish wire fields, message types, and RPC method names
// have been renamed to English (event/board/property). Field numbers are
// preserved across the rename.

package backend_configuration;

option csharp_namespace = "BackendConfiguration.Pn.Grpc.Events";

import "google/protobuf/timestamp.proto";
import "documents.proto";

service Events {
  rpc ListProperties(ListPropertiesRequest) returns (ListPropertiesResponse);
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc ListTaskTracker(ListTaskTrackerRequest) returns (ListTaskTrackerResponse);
  rpc StreamEventChanges(StreamEventChangesRequest) returns (stream EventChange);
  rpc CompleteEvent(CompleteEventRequest) returns (CompleteEventResponse);
  rpc SetComment(SetCommentRequest) returns (SetCommentResponse);
  rpc UploadPhoto(stream UploadPhotoChunk) returns (UploadPhotoResponse);
  rpc RemovePhoto(RemovePhotoRequest) returns (RemovePhotoResponse);
  rpc SetFieldValue(SetFieldValueRequest) returns (SetFieldValueResponse);
  // contract_version 1. Capability handshake: a server that predates it
  // answers UNIMPLEMENTED, which is the client's signal that none of the
  // contract_version >= 1 fields below are honoured.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  // contract_version 1. Reads one occurrence with the same authorisation and
  // shape as ListEvents. A task the caller may not read answers found=false
  // (never PERMISSION_DENIED), so ids cannot be probed.
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  // contract_version 2 (capability "list_changes"). Every occurrence of every
  // property the caller is assigned to, in one window, as changes since an
  // opaque cursor. Replaces per-property ListEvents / ListBoards calls and
  // the per-property stream polls for clients that support it. Does NOT
  // include the task-tracker (overdue) rows: keep calling ListTaskTracker.
  // Poll no faster than the stream (every 5 s); recommended every 15 s while
  // the task list is on screen with the default 3-day window (an unchanged
  // call then costs about a third of one round of per-property stream polls)
  // and the existing 5-minute refresh otherwise. The window is read in 7-day
  // chunks, so a stream-sized window costs about 1.5 such rounds per call:
  // poll it at most every 30 s. UNAVAILABLE: retry later; a reset snapshot is
  // never sent while an occurrence cannot be read.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
}

// contract_version 2.
message ListChangesRequest {
  // next_cursor of the previous ListChanges reply for the same window.
  // Empty = full snapshot. A cursor the server cannot use (corrupt, from
  // another server version, another caller, language or window, or issued
  // on an earlier UTC day) is answered with a full snapshot and reset = true,
  // never with an error.
  bytes cursor = 1;
  // Window, yyyy-MM-dd, inclusive. Both empty = today .. today+2 (UTC), the
  // app's list window. The server clamps the window to the stream's window
  // (today-7 .. today+30, UTC) and states the window it served in the reply;
  // a window entirely outside it is INVALID_ARGUMENT. When the window touches
  // today .. today+2, cases are eager-deployed exactly as ListEvents does for
  // today .. today+2 (for weekly weekday rules that can include later days of
  // the same week); otherwise nothing is deployed.
  string from_date_key = 2;
  string to_date_key = 3;
}

// contract_version 2. One change in a ListChangesResponse. Deliberately a
// separate message from EventChange (which the stream sends), so a stream
// client never meets a oneof case it does not know.
message ListChange {
  oneof kind {
    // New or changed occurrence, with version and etag. etag equals the
    // GetEvent etag of the same key; the content is the occurrence's own
    // (its own comment and field values).
    Event upserted = 1;
    // The occurrence with this full key (event_id, plan_day_key,
    // compliance_id; compliance_id is always present, 0 for recurrence-only)
    // is no longer in the window for this caller: completed (the window is
    // actionable-only), moved, out of the window, or its property assignment
    // was removed.
    EventKey removed = 2;
  }
}

// contract_version 2.
message ListChangesResponse {
  // With reset = false: upserts and removals against what the cursor held.
  // With reset = true: the complete content of the window (upserts only).
  repeated ListChange changes = 1;
  // Pass back on the next call for the same window. Opaque.
  bytes next_cursor = 2;
  // Every property the caller is assigned to now (complete list, every call).
  repeated Property properties = 3;
  // Every board of those properties (complete list, every call).
  repeated Board boards = 4;
  // Properties the cursor held that the caller is no longer assigned to.
  // Their occurrences are also listed as removals. Empty when reset is true.
  repeated string removed_property_ids = 5;
  // True when changes is a full snapshot: the request had no cursor or the
  // cursor could not be used. The client then replaces everything it holds
  // for the window with changes (and drops the occurrences not in it).
  bool reset = 6;
  // The window actually served (after defaulting and capping).
  string from_date_key = 7;
  string to_date_key = 8;
}

// contract_version 1.
message GetServerInfoRequest {}
// contract_version 1.
message GetServerInfoResponse {
  // Monotonic contract revision of this server. 1 = the first revision that
  // has this RPC; 2 adds ListChanges.
  int32 contract_version = 1;
  // Exactly the optional behaviours this server implements, e.g.
  // "request_id", "get_event", "event_version". Clients must test for the
  // capability, not compare contract_version.
  repeated string capabilities = 2;
}

// contract_version 1. Identifies one occurrence on the wire.
message EventKey {
  // Event.id (AreaRulePlanning id, decimal string), same type as Event.id.
  string event_id = 1;
  // Event.plan_day_key, yyyy-MM-dd.
  string plan_day_key = 2;
  // Event.compliance_id. When present, only the occurrence backed by that
  // Compliance row matches; when absent, any occurrence of event_id on
  // plan_day_key matches.
  optional int64 compliance_id = 3;
}

// contract_version 1.
message GetEventRequest { EventKey key = 1; }
// contract_version 1.
message GetEventResponse {
  // Unset when found is false.
  Event event = 1;
  bool found = 2;
}

// contract_version 1. Result of a RemovePhoto that carried request_id or
// expected_storage_id. Old requests (neither field set) get an empty
// RemovePhotoResponse exactly as before (outcome UNSPECIFIED).
enum RemovePhotoOutcome {
  REMOVE_PHOTO_OUTCOME_UNSPECIFIED = 0;
  // The photo was removed by this request (or, when replayed is true, by the
  // first delivery of this request id).
  REMOVE_PHOTO_OUTCOME_REMOVED = 1;
  // The slot held no photo; nothing was written. Success.
  REMOVE_PHOTO_OUTCOME_ALREADY_ABSENT = 2;
  // The slot holds a photo other than expected_storage_id; it was NOT
  // removed. current_storage_id names the photo that is there now.
  REMOVE_PHOTO_OUTCOME_SLOT_HOLDS_OTHER_PHOTO = 3;
}

message UploadPhotoChunk {
  oneof kind {
    UploadPhotoMeta meta = 1;
    bytes chunk = 2;
  }
}
message UploadPhotoMeta {
  string event_id = 1;
  int32 slot = 2;
  string content_type = 3;
  int64 client_ts_unix = 4;
  // Server-assigned PK of the Compliance row this event was emitted from
  // (see Index handler). 0 means "unknown" — legacy clients that pre-date
  // this field; server falls back to the site-filtered fuzzy lookup in
  // that case so in-flight outbox payloads keep draining.
  int64 compliance_id = 5;
  // Server-assigned PK of the SDK Case row backing this event. 0 = legacy.
  int64 microting_sdk_case_id = 6;
  // SDK Field.Id — matches FormField.id from ListEvents. The server
  // creates the FieldValue row with this Field.Id so multi-Picture-field
  // events bind each photo to the correct field. 0 = legacy clients
  // that pre-date this field; server falls back to BFS-first-Picture
  // discovery (matches the prior single-Picture assumption).
  int32 field_id = 7;
  // contract_version 1. Client-generated id (UUID recommended, at most 128
  // characters) of this write. Empty = legacy behaviour (every delivery is a
  // new upload). Non-empty: a repeat of an applied request returns the same
  // storage_id and writes nothing.
  string request_id = 8;
}
message UploadPhotoResponse {
  string storage_id = 1;
  // contract_version 1. True when request_id had already been applied and
  // this reply is the recorded result (no new upload was stored).
  bool replayed = 2;
}

message RemovePhotoRequest {
  string event_id = 1;
  int32 slot = 2;
  int64 client_ts_unix = 3;
  // See UploadPhotoMeta.compliance_id / microting_sdk_case_id. 0 = legacy.
  int64 compliance_id = 4;
  int64 microting_sdk_case_id = 5;
  // contract_version 1. See UploadPhotoMeta.request_id.
  string request_id = 6;
  // contract_version 1. UploadPhotoResponse.storage_id of the photo the
  // client means to remove. When set, the slot is cleared only if it still
  // holds exactly this photo; see RemovePhotoOutcome.
  string expected_storage_id = 7;
}
message RemovePhotoResponse {
  // contract_version 1. Set only when the request carried request_id or
  // expected_storage_id.
  RemovePhotoOutcome outcome = 1;
  // contract_version 1. True when request_id had already been applied;
  // outcome is then the recorded outcome of the first delivery.
  bool replayed = 2;
  // contract_version 1. With REMOVE_PHOTO_OUTCOME_SLOT_HOLDS_OTHER_PHOTO, the
  // storage id now in the slot. Empty otherwise.
  string current_storage_id = 3;
}

message CompleteEventRequest {
  string event_id = 1;
  bool completed = 2;
  string completed_by = 3;
  int64 client_ts_unix = 4;
  // See UploadPhotoMeta.compliance_id / microting_sdk_case_id. 0 = legacy.
  int64 compliance_id = 5;
  int64 microting_sdk_case_id = 6;
  // Bundled field-value writes applied AFTER the case is revived
  // (WorkflowState='created') and BEFORE the closure cascade
  // (PlanningCase/PlanningCaseSite Status=100 + core.CaseDelete soft-delete).
  // Empty for legacy clients — server still completes the case the same way.
  // Each entry corresponds to one prior SetFieldValue RPC; the bundle
  // collapses worker edits into a single round-trip at Complete time.
  repeated FieldValueWrite field_values = 7;
  // Optional comment write applied alongside field_values, same lifecycle
  // window. Empty string ("") means "no comment change" — the existing
  // Cases.Custom envelope is left untouched. Non-empty replaces the
  // event comment body verbatim, matching SetComment semantics.
  string comment = 8;
  // ISO-8601 date (yyyy-MM-dd); empty = fall back to deadline date
  string done_at_user_modifiable = 9;
  // contract_version 1. See UploadPhotoMeta.request_id. A repeat of an
  // applied completion answers success with the current Event,
  // answers_discarded=false and replayed=true. A different request (or no
  // request id) against an already completed occurrence keeps the
  // "already completed" answer.
  string request_id = 10;
}
message CompleteEventResponse {
  Event event = 1;
  // True when the caller lost the completion race (or echoed a stale
  // compliance_id with no recoverable open case) AND the request carried
  // answers (field_values and/or comment) that were discarded as a result.
  // Older clients ignore unknown fields, so this is additive and safe to
  // leave at its proto3 default (false) for every response that behaves as
  // it always has.
  bool answers_discarded = 2;
  // Short English text for the app to show the worker when
  // answers_discarded is true, e.g. "Already completed by <name> on <date>;
  // your answers were not saved." Empty when answers_discarded is false.
  string discarded_reason = 3;
  // contract_version 1. True when request_id had already been applied and
  // this reply describes the current state instead of applying it again.
  bool replayed = 4;
}

// One field-value write bundled into CompleteEventRequest.field_values.
// Mirrors the per-RPC SetFieldValueRequest pair (field_id + value) so the
// server-side handler can reuse the same lookup + canonicalization helpers.
message FieldValueWrite {
  // SDK Field.Id — matches SetFieldValueRequest.field_id and FormField.id.
  // Server rejects field_id <= 0.
  int32 field_id = 1;
  // Raw worker-facing value; canonicalized server-side per the existing
  // CanonicalizeFieldValueAsync helper (CheckBox + Select normalization).
  string value = 2;
}

message SetCommentRequest {
  string event_id = 1;
  string text = 2;
  int64 client_ts_unix = 3;
  // See UploadPhotoMeta.compliance_id / microting_sdk_case_id. 0 = legacy.
  int64 compliance_id = 4;
  int64 microting_sdk_case_id = 5;
  // contract_version 1. See UploadPhotoMeta.request_id. When set, the reply
  // Event also carries the real compliance_id / microting_sdk_case_id
  // (they stay 0 without it, as before), version and etag.
  string request_id = 6;
}
message SetCommentResponse {
  Event event = 1;
  // contract_version 1. True when request_id had already been applied.
  bool replayed = 2;
}

message SetFieldValueRequest {
  string event_id = 1;
  int32 field_id = 2;
  string value = 3;
  int64 client_ts_unix = 4;
  // See UploadPhotoMeta.compliance_id / microting_sdk_case_id. 0 = legacy.
  int64 compliance_id = 5;
  int64 microting_sdk_case_id = 6;
  // contract_version 1. See SetCommentRequest.request_id.
  string request_id = 7;
}
message SetFieldValueResponse {
  Event event = 1;
  // contract_version 1. True when request_id had already been applied.
  bool replayed = 2;
}

message ListPropertiesRequest {}
message ListPropertiesResponse { repeated Property properties = 1; }

message ListBoardsRequest { string property_id = 1; }
message ListBoardsResponse { repeated Board boards = 1; }

message ListEventsRequest {
  string property_id = 1;
  repeated string board_ids = 2;
  string from_date_key = 3;
  string to_date_key = 4;
}
message ListEventsResponse { repeated Event events = 1; }

// Full property-scoped compliance list for the mobile worker's "task
// tracker" view (mirror of the angular admin's BackendConfigurationTaskTrackerHelper.Index).
// No deadline window — actionable + missed + completed rotations are all
// returned, with per-row status carried on the existing `completed` field
// and the new `task_is_expired` field (see Event below).
message ListTaskTrackerRequest {
  int32 property_id = 1;
}
message ListTaskTrackerResponse { repeated Event events = 1; }

message StreamEventChangesRequest {
  string property_id = 1;
  repeated string board_ids = 2;
}

message EventChange {
  oneof kind {
    Event upserted = 1;
    string removed_id = 2;
    RemovedOccurrence removed_occurrence = 3;
  }
}

message RemovedOccurrence {
  string event_id = 1;
  string plan_day_key = 2;
}

message Property {
  string id = 1;
  string name = 2;
}

message Board {
  string id = 1;
  string property_id = 2;
  string name = 3;
  string color_hex = 4;
}

message Event {
  string id = 1;
  string property_id = 2;
  string board_id = 3;
  string plan_day_key = 4;
  string planned_at = 5;
  string task_text = 6;
  string calendar_color = 7;
  bool completed = 8;
  string completed_by = 9;
  string description_html = 10;
  google.protobuf.Timestamp updated_at = 11;
  string comment = 12;
  repeated Attachment attachments = 13;
  // eform template id this event is backed by; clients use this to look up template-specific field structure
  int32 eform_id = 14;
  // Form-field structure + current values for the eForm template backing
  // this event. Empty when no Case exists yet (recurrence-only tasks).
  repeated FormField fields = 15;
  // Server-assigned PK of the Compliance row this event was emitted from.
  // Round-tripped through the Flutter Drift cache and back on every write
  // so the server can resolve compliance + sdk case deterministically
  // (no fuzzy OrderBy(Deadline).First() lookup). 0 = recurrence-only task
  // with no backing compliance yet (or legacy server pre-dating this field).
  int64 compliance_id = 16;
  // Server-assigned PK of the SDK Case row backing this event. 0 means
  // "no backing case" (recurrence-only) or a legacy server.
  int64 microting_sdk_case_id = 17;
  // True when the event's deadline has passed AND the underlying case is
  // either retracted (Case.WorkflowState=Removed AND Status=77) or simply
  // past its deadline without being completed (Case.Deadline < UtcNow AND
  // Status != 100). Surfaced primarily by ListTaskTracker so flutter can
  // render missed rotations in red. The calendar-week view (ListEvents)
  // pre-filters non-actionable rows out and so emits this as false; default
  // proto3 zero-value remains backwards-compatible with older clients.
  bool task_is_expired = 18;
  // contract_version 1. Ordering hint: the newest UpdatedAt (UTC,
  // microseconds since the Unix epoch) of the stored rows this Event is
  // built from. Ordered but imperfect: blind to time-driven changes (expiry,
  // window roll-over), to template / translation / site-language changes and
  // to app-server clock steps. Unset when no backing row was found. Compare
  // etag for equality. Set on every read; on write replies only when the
  // request carried request_id.
  optional int64 version = 19;
  // contract_version 1. Stable hash of this Event's content excluding version
  // and etag: equal content gives an equal etag across calls and across
  // servers of the same version. Opaque; compare for equality only.
  // Caveat: a ListEvents / ListTaskTracker / StreamEventChanges reply that
  // holds SEVERAL occurrences of the same event id (a multi-day window) can
  // give a later occurrence the comment and field values of an earlier one
  // (a known server defect kept for installed apps); GetEvent and write
  // replies always carry the occurrence's own content. For such occurrences
  // the list etag differs from the GetEvent etag without any write, so do
  // not compare a multi-day list etag with a GetEvent etag; compare GetEvent
  // with GetEvent (or a write reply), or use a one-day list.
  string etag = 20;
  // contract_version 1. Calendar date (yyyy-MM-dd) of the backing
  // Compliance.Deadline, as stored (a date, no time zone). Empty when the
  // occurrence has no compliance yet. A UTC due_at instant will follow once
  // properties carry a time zone; it is deliberately not derived now.
  string due_date_key = 21;
  // contract_version 1. Local wall-clock start time (HH:mm) the task is
  // planned for, in the property's (unstated) local time. Empty for all-day
  // tasks and when unknown. Unlike planned_at it is never "00:00" for an
  // all-day task.
  string due_time_local = 22;
}

message Attachment {
  microting.documents.AttachmentSource source = 1;
  string name = 2;                  // legacy / fallback display label
  int32 id = 3;                     // AreaRulePlanningFile.Id (CALENDAR_FILE only)
  string original_file_name = 4;    // e.g. "report.pdf"
  string mime_type = 5;             // e.g. "application/pdf"
  int64 size_bytes = 6;
}

// Field of the eForm template that backs an Event.
// Carries both the template definition (label, type, options) and the
// worker's current answer (value).
message FormField {
  // SDK FieldDto.Id — stable for the same field across the lifetime of the
  // template; clients can use this as a stable key in caches.
  int32 id = 1;
  // Worker-facing question text.
  string label = 2;
  // Optional supporting text.
  string description = 3;
  // SDK field type name: "Text" | "Number" | "MultiSelect" | "SingleSelect"
  // | "Picture" | "Comment" | "Date" | "CheckBox" | "EntitySearch" |
  // "EntitySelect" | "ShowPdf" | "FieldGroup" | "SaveButton" | "Audio" |
  // "Movie" | "Signature" | "Timer" | "None". Unrecognized values render
  // as a generic "Unknown" placeholder client-side.
  string field_type = 4;
  // True if the eForm marks this field as required.
  bool required = 5;
  // Selectable options for SingleSelect / MultiSelect / CheckBox; ignored
  // for other field types. Order is significant (matches index).
  repeated string options = 6;
  // Worker's current answer, encoded as a string per SDK FieldValue
  // convention. Empty string = not yet answered.
  string value = 7;
}
