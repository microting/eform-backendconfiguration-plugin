syntax = "proto3";

// English wire contract per
// docs/superpowers/specs/2026-05-25-lift-danish-carve-outs-design.md.
// All previously-Danish wire fields, message types, and RPC method names
// have been renamed to English (event/board/property). Field numbers are
// preserved across the rename.

package backend_configuration;

option csharp_namespace = "BackendConfiguration.Pn.Grpc.Events";

import "google/protobuf/timestamp.proto";
import "documents.proto";

service Events {
  rpc ListProperties(ListPropertiesRequest) returns (ListPropertiesResponse);
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc ListTaskTracker(ListTaskTrackerRequest) returns (ListTaskTrackerResponse);
  rpc StreamEventChanges(StreamEventChangesRequest) returns (stream EventChange);
  rpc CompleteEvent(CompleteEventRequest) returns (CompleteEventResponse);
  rpc SetComment(SetCommentRequest) returns (SetCommentResponse);
  rpc UploadPhoto(stream UploadPhotoChunk) returns (UploadPhotoResponse);
  rpc RemovePhoto(RemovePhotoRequest) returns (RemovePhotoResponse);
  rpc SetFieldValue(SetFieldValueRequest) returns (SetFieldValueResponse);
}

message UploadPhotoChunk {
  oneof kind {
    UploadPhotoMeta meta = 1;
    bytes chunk = 2;
  }
}
message UploadPhotoMeta {
  string event_id = 1;
  int32 slot = 2;
  string content_type = 3;
  int64 client_ts_unix = 4;
  // Server-assigned PK of the Compliance row this event was emitted from
  // (see Index handler). 0 means "unknown" — legacy clients that pre-date
  // this field; server falls back to the site-filtered fuzzy lookup in
  // that case so in-flight outbox payloads keep draining.
  int64 compliance_id = 5;
  // Server-assigned PK of the SDK Case row backing this event. 0 = legacy.
  int64 microting_sdk_case_id = 6;
  // SDK Field.Id — matches FormField.id from ListEvents. The server
  // creates the FieldValue row with this Field.Id so multi-Picture-field
  // events bind each photo to the correct field. 0 = legacy clients
  // that pre-date this field; server falls back to BFS-first-Picture
  // discovery (matches the prior single-Picture assumption).
  int32 field_id = 7;
}
message UploadPhotoResponse {
  string storage_id = 1;
}

message RemovePhotoRequest {
  string event_id = 1;
  int32 slot = 2;
  int64 client_ts_unix = 3;
  // See UploadPhotoMeta.compliance_id / microting_sdk_case_id. 0 = legacy.
  int64 compliance_id = 4;
  int64 microting_sdk_case_id = 5;
}
message RemovePhotoResponse {}

message CompleteEventRequest {
  string event_id = 1;
  bool completed = 2;
  string completed_by = 3;
  int64 client_ts_unix = 4;
  // See UploadPhotoMeta.compliance_id / microting_sdk_case_id. 0 = legacy.
  int64 compliance_id = 5;
  int64 microting_sdk_case_id = 6;
  // Bundled field-value writes applied AFTER the case is revived
  // (WorkflowState='created') and BEFORE the closure cascade
  // (PlanningCase/PlanningCaseSite Status=100 + core.CaseDelete soft-delete).
  // Empty for legacy clients — server still completes the case the same way.
  // Each entry corresponds to one prior SetFieldValue RPC; the bundle
  // collapses worker edits into a single round-trip at Complete time.
  repeated FieldValueWrite field_values = 7;
  // Optional comment write applied alongside field_values, same lifecycle
  // window. Empty string ("") means "no comment change" — the existing
  // Cases.Custom envelope is left untouched. Non-empty replaces the
  // event comment body verbatim, matching SetComment semantics.
  string comment = 8;
  // ISO-8601 date (yyyy-MM-dd); empty = fall back to deadline date
  string done_at_user_modifiable = 9;
}
message CompleteEventResponse { Event event = 1; }

// One field-value write bundled into CompleteEventRequest.field_values.
// Mirrors the per-RPC SetFieldValueRequest pair (field_id + value) so the
// server-side handler can reuse the same lookup + canonicalization helpers.
message FieldValueWrite {
  // SDK Field.Id — matches SetFieldValueRequest.field_id and FormField.id.
  // Server rejects field_id <= 0.
  int32 field_id = 1;
  // Raw worker-facing value; canonicalized server-side per the existing
  // CanonicalizeFieldValueAsync helper (CheckBox + Select normalization).
  string value = 2;
}

message SetCommentRequest {
  string event_id = 1;
  string text = 2;
  int64 client_ts_unix = 3;
  // See UploadPhotoMeta.compliance_id / microting_sdk_case_id. 0 = legacy.
  int64 compliance_id = 4;
  int64 microting_sdk_case_id = 5;
}
message SetCommentResponse { Event event = 1; }

message SetFieldValueRequest {
  string event_id = 1;
  int32 field_id = 2;
  string value = 3;
  int64 client_ts_unix = 4;
  // See UploadPhotoMeta.compliance_id / microting_sdk_case_id. 0 = legacy.
  int64 compliance_id = 5;
  int64 microting_sdk_case_id = 6;
}
message SetFieldValueResponse { Event event = 1; }

message ListPropertiesRequest {}
message ListPropertiesResponse { repeated Property properties = 1; }

message ListBoardsRequest { string property_id = 1; }
message ListBoardsResponse { repeated Board boards = 1; }

message ListEventsRequest {
  string property_id = 1;
  repeated string board_ids = 2;
  string from_date_key = 3;
  string to_date_key = 4;
}
message ListEventsResponse { repeated Event events = 1; }

// Full property-scoped compliance list for the mobile worker's "task
// tracker" view (mirror of the angular admin's BackendConfigurationTaskTrackerHelper.Index).
// No deadline window — actionable + missed + completed rotations are all
// returned, with per-row status carried on the existing `completed` field
// and the new `task_is_expired` field (see Event below).
message ListTaskTrackerRequest {
  int32 property_id = 1;
}
message ListTaskTrackerResponse { repeated Event events = 1; }

message StreamEventChangesRequest {
  string property_id = 1;
  repeated string board_ids = 2;
}

message EventChange {
  oneof kind {
    Event upserted = 1;
    string removed_id = 2;
  }
}

message Property {
  string id = 1;
  string name = 2;
}

message Board {
  string id = 1;
  string property_id = 2;
  string name = 3;
  string color_hex = 4;
}

message Event {
  string id = 1;
  string property_id = 2;
  string board_id = 3;
  string plan_day_key = 4;
  string planned_at = 5;
  string task_text = 6;
  string calendar_color = 7;
  bool completed = 8;
  string completed_by = 9;
  string description_html = 10;
  google.protobuf.Timestamp updated_at = 11;
  string comment = 12;
  repeated Attachment attachments = 13;
  // eform template id this event is backed by; clients use this to look up template-specific field structure
  int32 eform_id = 14;
  // Form-field structure + current values for the eForm template backing
  // this event. Empty when no Case exists yet (recurrence-only tasks).
  repeated FormField fields = 15;
  // Server-assigned PK of the Compliance row this event was emitted from.
  // Round-tripped through the Flutter Drift cache and back on every write
  // so the server can resolve compliance + sdk case deterministically
  // (no fuzzy OrderBy(Deadline).First() lookup). 0 = recurrence-only task
  // with no backing compliance yet (or legacy server pre-dating this field).
  int64 compliance_id = 16;
  // Server-assigned PK of the SDK Case row backing this event. 0 means
  // "no backing case" (recurrence-only) or a legacy server.
  int64 microting_sdk_case_id = 17;
  // True when the event's deadline has passed AND the underlying case is
  // either retracted (Case.WorkflowState=Removed AND Status=77) or simply
  // past its deadline without being completed (Case.Deadline < UtcNow AND
  // Status != 100). Surfaced primarily by ListTaskTracker so flutter can
  // render missed rotations in red. The calendar-week view (ListEvents)
  // pre-filters non-actionable rows out and so emits this as false; default
  // proto3 zero-value remains backwards-compatible with older clients.
  bool task_is_expired = 18;
}

message Attachment {
  microting.documents.AttachmentSource source = 1;
  string name = 2;                  // legacy / fallback display label
  int32 id = 3;                     // AreaRulePlanningFile.Id (CALENDAR_FILE only)
  string original_file_name = 4;    // e.g. "report.pdf"
  string mime_type = 5;             // e.g. "application/pdf"
  int64 size_bytes = 6;
}

// Field of the eForm template that backs an Event.
// Carries both the template definition (label, type, options) and the
// worker's current answer (value).
message FormField {
  // SDK FieldDto.Id — stable for the same field across the lifetime of the
  // template; clients can use this as a stable key in caches.
  int32 id = 1;
  // Worker-facing question text.
  string label = 2;
  // Optional supporting text.
  string description = 3;
  // SDK field type name: "Text" | "Number" | "MultiSelect" | "SingleSelect"
  // | "Picture" | "Comment" | "Date" | "CheckBox" | "EntitySearch" |
  // "EntitySelect" | "ShowPdf" | "FieldGroup" | "SaveButton" | "Audio" |
  // "Movie" | "Signature" | "Timer" | "None". Unrecognized values render
  // as a generic "Unknown" placeholder client-side.
  string field_type = 4;
  // True if the eForm marks this field as required.
  bool required = 5;
  // Selectable options for SingleSelect / MultiSelect / CheckBox; ignored
  // for other field types. Order is significant (matches index).
  repeated string options = 6;
  // Worker's current answer, encoded as a string per SDK FieldValue
  // convention. Empty string = not yet answered.
  string value = 7;
}
